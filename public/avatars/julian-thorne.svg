<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-julian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4D36" />
      <stop offset="100%" stop-color="#0F2A1D" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#bg-julian)" />
  <circle cx="100" cy="100" r="95" fill="none" stroke="#C9A15A" stroke-width="2" stroke-dasharray="4 2" />
  <!-- Minimalist Chef Illustration -->
  <g transform="translate(100, 105)" fill="#F6F1E7" stroke="#17241D" stroke-width="1.5">
    <!-- Chef Jacket / Shoulders -->
    <path d="M-45 65 C-40 30, -25 20, 0 20 C25 20, 40 30, 45 65 Z" fill="#F6F1E7" />
    <path d="M-10 20 L-5 65 M5 20 L5 65" stroke="#C9A15A" stroke-width="2" />
    <!-- Neck -->
    <rect x="-12" y="2" width="24" height="20" fill="#E4ECE2" stroke="none" />
    <!-- Head -->
    <ellipse cx="0" cy="-10" rx="22" ry="26" fill="#F6F1E7" stroke="#0F2A1D" />
    <!-- Hair / Beard -->
    <path d="M-22 -14 C-20 -38, 20 -38, 22 -14 C15 -28, -15 -28, -22 -14 Z" fill="#2A6647" />
    <path d="M-16 -2 C-12 16, 12 16, 16 -2 C10 10, -10 10, -16 -2 Z" fill="#2A6647" />
    <!-- Chef Toque Hat -->
    <path d="M-24 -28 C-30 -50, -15 -62, 0 -62 C15 -62, 30 -50, 24 -28 Z" fill="#FFFFFF" stroke="#C9A15A" stroke-width="2" />
  </g>
</svg>

